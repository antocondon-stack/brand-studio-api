[build]
builder = "NIXPACKS"
# Skip font clone during build to avoid timeouts
# Fonts should be committed to git or downloaded at runtime
buildCommand = "npm install && SKIP_FONT_SETUP=true npm run build"

[deploy]
startCommand = "npm start"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
